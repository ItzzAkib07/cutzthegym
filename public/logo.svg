<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Silver Chrome Linear Gradient -->
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E2E2" />
      <stop offset="50%" stop-color="#9C9C9C" />
      <stop offset="75%" stop-color="#D6D6D6" />
      <stop offset="100%" stop-color="#6E6E6E" />
    </linearGradient>

    <!-- Gold Luxury Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5DE9C" />
      <stop offset="50%" stop-color="#C9A04A" />
      <stop offset="100%" stop-color="#9E7B2F" />
    </linearGradient>

    <!-- Metallic Shadow Filter -->
    <filter id="metallicShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Left Emblem: Angular Shield & Chiseled Geometric Wings -->
  <g transform="translate(10, 15)">
    <!-- Outer Shield Crest -->
    <polygon points="55,0 95,20 80,95 55,120 30,95 15,20" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
    <!-- Inner Core Cut -->
    <polygon points="55,10 85,26 73,88 55,108 37,88 25,26" fill="#121212" stroke="url(#chromeGradient)" stroke-width="1.5" />
    <!-- Chiseled Razor Blade 'C' -->
    <path d="M 68 40 L 46 40 L 40 55 L 40 75 L 46 90 L 68 90 L 72 78 L 56 78 L 53 72 L 53 58 L 56 52 L 72 52 Z" fill="url(#chromeGradient)" filter="url(#metallicShadow)" />
    <!-- Gold Center Accent Star -->
    <polygon points="55,20 58,30 68,30 60,36 63,46 55,40 47,46 50,36 42,30 52,30" fill="url(#goldGradient)" />
  </g>

  <!-- Typography Block -->
  <g transform="translate(130, 20)">
    <!-- Main Wordmark: CUTZ -->
    <text x="0" y="65" font-family="'Bebas Neue', 'Oswald', sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="url(#chromeGradient)" filter="url(#metallicShadow)">
      CUTZ
    </text>

    <!-- Wordmark: THE GYM -->
    <text x="210" y="65" font-family="'Oswald', sans-serif" font-size="44" font-weight="700" letter-spacing="6" fill="url(#goldGradient)">
      THE GYM
    </text>

    <!-- Sub-heading Divider Line -->
    <line x1="0" y1="84" x2="350" y2="84" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
    <circle cx="175" cy="84" r="4" fill="url(#chromeGradient)" />

    <!-- Sub-brand Tagline: BY IFBB PRO KRISHNA CHAUHAN -->
    <text x="2" y="106" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#E6C36A">
      BY IFBB PRO KRISHNA CHAUHAN
    </text>
  </g>
</svg>

